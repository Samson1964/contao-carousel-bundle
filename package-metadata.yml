# Quelle fuer die Metadaten im Contao Manager (contao/package-metadata).
# Aenderungen hier werden von Claude in den Fork uebertragen.
# Der englische Block wird beim Abgleich ergaenzt, falls er fehlt.

de:
    title: carouFredSel-Bildkarussell
    description: >
        Bildkarussell auf Basis des jQuery-Plugins carouFredSel: Galerie mit
        synchronisierter Vorschauleiste, Newsticker, bildschirmfüllende
        Hintergrund-Slideshow und ein Wrapper, der beliebige Inhaltselemente
        in ein Karussell verpackt. Portierung der Contao-3-Erweiterung
        dk_caroufredsel von Dirk Klemmt für Contao 4.13 und Contao 5.
    keywords:
        - Karussell
        - Slider
        - Slideshow
        - Galerie
        - Newsticker
        - jQuery

en:
    title: carouFredSel image carousel
    description: >
        Image carousel based on the jQuery plugin carouFredSel: gallery with
        a synchronised thumbnail bar, news ticker, full-screen background
        slideshow and a wrapper that turns arbitrary content elements into a
        carousel. Port of the Contao 3 extension dk_caroufredsel by Dirk
        Klemmt for Contao 4.13 and Contao 5.
    keywords:
        - carousel
        - slider
        - slideshow
        - gallery
        - newsticker
        - jQuery
