# Quelle fuer die Metadaten im Contao Manager (contao/package-metadata).
# Aenderungen hier werden von Claude in den Fork uebertragen.
# Der englische Block wird beim Abgleich ergaenzt, falls er fehlt.

de:
    title: carouFredSel-Bildkarussell
    description: >
        Bildkarussell auf Swiper-Basis: Galerie mit synchronisierter
        Vorschauleiste, Newsticker, Hintergrund-Slideshow im Vollbild und
        ein Wrapper, der beliebige Inhaltselemente in ein Karussell
        verpackt.

        Die Karussell-Einstellungen (Abspielverhalten, Übergänge, Größen,
        Navigation, Paginierung, Tastatur- und Mausrad-Steuerung) werden
        zentral gepflegt und von beliebig vielen Elementen und Modulen
        wiederverwendet. Zusätzlich gibt es einen Pause-Schalter und eine
        Fortschrittsanzeige.

        Portierung der Contao-3-Erweiterung von Dirk Klemmt; seit
        Version 3.0.0 mit Swiper statt jQuery.
    keywords:
        - Karussell
        - Slider
        - Slideshow
        - Galerie
        - Newsticker
        - Swiper

en:
    title: carouFredSel image carousel
    description: >
        Image carousel based on Swiper: gallery with a synchronized
        thumbnail bar, news ticker, full-screen background slideshow and a
        wrapper that turns any content elements into a carousel.

        The carousel settings (playback, transitions, sizes, navigation,
        pagination, keyboard and mouse wheel control) are managed centrally
        and can be reused by any number of elements and modules. A pause
        button and an autoplay progress indicator are included.

        Port of the Contao 3 extension by Dirk Klemmt; Swiper has replaced
        jQuery as of version 3.0.0.
    keywords:
        - carousel
        - slider
        - slideshow
        - gallery
        - newsticker
        - swiper
